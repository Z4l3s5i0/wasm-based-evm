[package]
name = "db_exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
redb = "4.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5.4", features = ["derive"] }
anyhow = "1.0"
alloy-rlp = { version = "0.3.15", features = ["derive"] }
hex = "0.4.3"

alloy-primitives = { version = "1.5.7", features = ["serde"] }
alloy-consensus = { version = "1.6.3" }
wasix_eth_storage = { path = "../../../wasm-based-evm/wasix_eth/wasix_eth_storage" }
wasix_eth_types = { path = "../../../wasm-based-evm/wasix_eth/wasix_eth_types" }
wasix_eth_utils = { path = "../../../wasm-based-evm/wasix_eth/wasix_eth_utils" }
ruint = "1.12.3"
alloy-trie = "0.9.5"
alloy-rpc-types-engine = "1.6.3"

[workspace]
