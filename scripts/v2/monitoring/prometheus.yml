global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'metrics-server'
    static_configs:
      - targets: ['metrics-server:9100']

  # Individual nodes will be added dynamically or via file_sd_config if needed
  # For now, we rely on the metrics-server to aggregate, or we can add them here.
  # Since start_local.sh generates the docker-compose, it's easier to have a static
  # config that points to the services by name.
