syntax = "proto3";
package evm_rpc;

service TransactionService {
  rpc ExecuteTransaction (TransactionRequest) returns (TransactionResponse);
  
  // New RPCs
  rpc EthAccounts (Empty) returns (AccountsResponse);
  rpc EthBlockNumber (Empty) returns (BlockNumberResponse);
  rpc EthGasPrice (Empty) returns (GasPriceResponse);
  rpc EthGetBalance (GetBalanceRequest) returns (BalanceResponse);
  rpc EthGetBlockByNumber (GetBlockByNumberRequest) returns (BlockResponse);
  rpc EthGetBlockByHash (GetBlockByHashRequest) returns (BlockResponse);
  rpc EthGetBlockTransactionCountByHash (GetBlockTransactionCountByHashRequest) returns (TransactionCountResponse);
  rpc EthGetBlockTransactionCountByNumber (GetBlockTransactionCountByNumberRequest) returns (TransactionCountResponse);
  rpc EthGetTransactionByHash (GetTransactionByHashRequest) returns (TransactionInfoResponse);
  rpc EthGetTransactionReceipt (GetTransactionByHashRequest) returns (TransactionReceiptResponse);
  rpc EthSendTransaction (TransactionRequest) returns (TransactionResponse);
  rpc EthCall (TransactionRequest) returns (TransactionResponse);
  rpc EthGetCode (GetCodeRequest) returns (CodeResponse);
  rpc EthGetRoots (Empty) returns (RootsResponse);
  rpc ProposeBlock (ProposeBlockRequest) returns (ProposeBlockResponse);
  rpc EthGetMempool (Empty) returns (MempoolResponse);

  rpc EngineNewPayload (ExecutionPayload) returns (PayloadStatus);
  rpc EngineForkchoiceUpdated (ForkchoiceUpdatedRequest) returns (ForkchoiceUpdatedResponse);
  rpc EngineGetPayload (GetPayloadRequest) returns (ExecutionPayload);
  
  // P2P RPCs
  rpc NetPeerCount (Empty) returns (NetPeerCountResponse);
  rpc NetPeers (Empty) returns (NetPeersResponse);
  rpc NetAddPeer (NetAddPeerRequest) returns (NetAddPeerResponse);
  rpc NetNodeInfo (Empty) returns (NetNodeInfoResponse);
}

message NetPeerCountResponse {
  uint64 count = 1;
}

message NetPeersResponse {
  repeated PeerInfo peers = 1;
}

message PeerInfo {
  string id = 1;
  string addr = 2;
  string enr = 3;
}

message NetAddPeerRequest {
  string addr = 1; // Multiaddr or ENR
}

message NetAddPeerResponse {
  bool success = 1;
  string message = 2;
}

message NetNodeInfoResponse {
  string enr = 1;
  string node_id = 2;
  repeated string listen_addresses = 3;
}

message ForkchoiceUpdatedRequest {
  ForkchoiceState forkchoice_state = 1;
  PayloadAttributes payload_attributes = 2; // Optional, can be null/empty
}

message ForkchoiceState {
  string head_block_hash = 1;
  string safe_block_hash = 2;
  string finalized_block_hash = 3;
}

message PayloadAttributes {
  uint64 timestamp = 1;
  string prev_randao = 2;
  string suggested_fee_recipient = 3;
  repeated Withdrawal withdrawals = 4;
  string parent_beacon_block_root = 5;
}

message Withdrawal {
  uint64 index = 1;
  uint64 validator_index = 2;
  string address = 3;
  string amount = 4; // U256 as string
}

message ForkchoiceUpdatedResponse {
  PayloadStatus payload_status = 1;
  string payload_id = 2; // Optional, hex string
}

message GetPayloadRequest {
  string payload_id = 1;
}

message ExecutionPayload {
  string parent_hash = 1;
  string fee_recipient = 2;
  string state_root = 3;
  string receipts_root = 4;
  string logs_bloom = 5;
  string prev_randao = 6;
  uint64 block_number = 7;
  uint64 gas_limit = 8;
  uint64 gas_used = 9;
  uint64 timestamp = 10;
  bytes extra_data = 11;
  string base_fee_per_gas = 12;
  string block_hash = 13;
  repeated bytes transactions = 14;
  repeated Withdrawal withdrawals = 15;
  uint64 blob_gas_used = 16;
  uint64 excess_blob_gas = 17;
  string transactions_root = 18;
  string withdrawals_root = 19;
}

message PayloadStatus {
  string status = 1; // VALID, INVALID, SYNCING, ACCEPTED, INVALID_BLOCK_HASH
  string latest_valid_hash = 2;
  string validation_error = 3;
}

message Empty {}

message AccountsResponse {
  repeated string addresses = 1;
}

message BlockNumberResponse {
  uint64 number = 1;
}

message GasPriceResponse {
  uint64 price = 1;
}

message GetBalanceRequest {
  string address = 1;
  string block_tag = 2; // e.g., "latest", "earliest", or a block number (as string for simplicity)
}

message BalanceResponse {
  string balance = 1; // Return as string to handle large U256 values
}

message GetCodeRequest {
  string address = 1;
  string block_tag = 2;
}

message CodeResponse {
  bytes code = 1;
}

message RootsResponse {
  string state_root = 1;
  string transactions_root = 2;
  string receipts_root = 3;
  string withdrawals_root = 4;
}

message GetBlockByNumberRequest {
  uint64 number = 1;
  bool full_transactions = 2;
}

message GetBlockByHashRequest {
  string hash = 1;
  bool full_transactions = 2;
}

message BlockResponse {
  uint64 number = 1;
  string hash = 2;
  string parent_hash = 3;
  uint64 timestamp = 4;
  repeated string transactions = 5; // Transaction hashes or full transactions
}

message GetBlockTransactionCountByHashRequest {
  string hash = 1;
}

message GetBlockTransactionCountByNumberRequest {
  uint64 number = 1;
}

message TransactionCountResponse {
  uint64 count = 1;
}

message GetTransactionByHashRequest {
  string hash = 1;
}

message TransactionInfoResponse {
  string hash = 1;
  uint64 nonce = 2;
  string from = 3;
  string to = 4;
  string value = 5;
  bytes data = 6;
  uint64 gas_limit = 7;
  uint64 gas_price = 8;
  uint64 block_number = 9;
  string block_hash = 10;
}

message TransactionRequest {
  string from = 1;
  string to = 2;
  string value = 3;
  bytes data = 4;
  uint64 gas_limit = 5;
  uint64 gas_price = 6;
  uint64 nonce = 7;
}

message TransactionResponse {
  bool success = 1;
  string message = 2;
  string tx_hash = 3;
  string contract_address = 4;
  bytes return_data = 5;
}

message TransactionReceiptResponse {
  string transaction_hash = 1;
  uint64 transaction_index = 2;
  string block_hash = 3;
  uint64 block_number = 4;
  string from = 5;
  string to = 6;
  uint64 cumulative_gas_used = 7;
  uint64 gas_used = 8;
  string contract_address = 9;
  repeated LogEntry logs = 10;
  string logs_bloom = 11;
  uint64 status = 12; // 1 for success, 0 for failure
}

message LogEntry {
  string address = 1;
  repeated string topics = 2;
  bytes data = 3;
  uint64 block_number = 4;
  string block_hash = 5;
  string transaction_hash = 6;
  uint64 transaction_index = 7;
  uint64 log_index = 8;
}

message ProposeBlockRequest {
  uint64 slot = 1;
  string parent_hash = 2;
  repeated TransactionRequest transactions = 3;
  uint64 timestamp = 4;
  string fee_recipient = 5;
  bool from_mempool = 6;
  uint32 max_transactions = 7;
}

message MempoolResponse {
  repeated TransactionInfoResponse transactions = 1;
}

message ProposeBlockResponse {
  bool success = 1;
  string block_hash = 2;
  string message = 3;
  repeated TransactionResponse tx_results = 4;
}
