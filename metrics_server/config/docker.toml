[server]
bind_addr = "0.0.0.0:9100"
[storage]
kind = "redb"
path = "data/metrics.redb"

[collection]
interval_seconds = 5
timeout_ms = 2000
max_concurrent_nodes = 16

[bootstrap]
enabled = true
network = "devnet"
chain_id = 12345
registration_token = ""
probe_interval_seconds = 15
stale_after_seconds = 60
max_bootstrap_nodes = 32
allow_private_ips = true
allow_loopback_ips = true

[experiment]
id = "exp-local-devnet-001"
name = "Local devnet metrics test"
description = "Collecting metrics from local Ethereum-compatible nodes"
tags = ["local", "devnet"]



