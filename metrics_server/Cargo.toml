[package]
name = "metrics_server"
version = "0.1.0"
edition = "2024"
authors = ["Z4l3s5i0"]

[dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
tokio = { version = "1.47.0", features = [ "rt-multi-thread", "rt", "macros", "sync", "time", "io-util", "net", "signal" ] }
serde = { version = "1.0.228", features = ["derive", "std", "serde_derive"] }
serde_json = "1.0.0"
clap = { version = "4.5.4", features = ["derive"] }
chrono = "0.4"
reqwest = { version = "0.11.8", features = ["json", "serde_json"] }
prometheus = "0.14.0"
redb = "4.1.0"
md5 = "0.7"
tower = "0.5.3"
tower-http = "0.5.2"

axum = "0.8"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
