syntax = "proto3";
package evm_rpc;

service TransactionService {
  rpc ExecuteTransaction (TransactionRequest) returns (TransactionResponse);
  
  // New RPCs
  rpc EthAccounts (Empty) returns (AccountsResponse);
  rpc EthBlockNumber (Empty) returns (BlockNumberResponse);
  rpc EthGasPrice (Empty) returns (GasPriceResponse);
  rpc EthGetBalance (GetBalanceRequest) returns (BalanceResponse);
  rpc EthGetBlockByNumber (GetBlockByNumberRequest) returns (BlockResponse);
  rpc EthGetBlockByHash (GetBlockByHashRequest) returns (BlockResponse);
  rpc EthGetBlockTransactionCountByHash (GetBlockTransactionCountByHashRequest) returns (TransactionCountResponse);
  rpc EthGetBlockTransactionCountByNumber (GetBlockTransactionCountByNumberRequest) returns (TransactionCountResponse);
  rpc EthGetTransactionByHash (GetTransactionByHashRequest) returns (TransactionInfoResponse);
  rpc EthSendTransaction (TransactionRequest) returns (TransactionResponse);
  rpc EthCall (TransactionRequest) returns (TransactionResponse);
}

message Empty {}

message AccountsResponse {
  repeated string addresses = 1;
}

message BlockNumberResponse {
  uint64 number = 1;
}

message GasPriceResponse {
  uint64 price = 1;
}

message GetBalanceRequest {
  string address = 1;
  string block_tag = 2; // e.g., "latest", "earliest", or a block number (as string for simplicity)
}

message BalanceResponse {
  string balance = 1; // Return as string to handle large U256 values
}

message GetBlockByNumberRequest {
  uint64 number = 1;
  bool full_transactions = 2;
}

message GetBlockByHashRequest {
  string hash = 1;
  bool full_transactions = 2;
}

message BlockResponse {
  uint64 number = 1;
  string hash = 2;
  string parent_hash = 3;
  uint64 timestamp = 4;
  repeated string transactions = 5; // Transaction hashes or full transactions
}

message GetBlockTransactionCountByHashRequest {
  string hash = 1;
}

message GetBlockTransactionCountByNumberRequest {
  uint64 number = 1;
}

message TransactionCountResponse {
  uint64 count = 1;
}

message GetTransactionByHashRequest {
  string hash = 1;
}

message TransactionInfoResponse {
  string hash = 1;
  uint64 nonce = 2;
  string from = 3;
  string to = 4;
  string value = 5;
  bytes data = 6;
  uint64 gas_limit = 7;
  uint64 gas_price = 8;
  uint64 block_number = 9;
  string block_hash = 10;
}

message TransactionRequest {
  string from = 1;
  optional string to = 2;
  string value = 3;
  bytes data = 4;
  uint64 gas_limit = 5;
  uint64 gas_price = 6;
  uint64 nonce = 7;
}

message TransactionResponse {
  bool success = 1;
  string message = 2;
  string tx_hash = 3;
  string contract_address = 4;
  bytes return_data = 5;
}
