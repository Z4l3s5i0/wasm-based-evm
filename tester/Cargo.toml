[package]
name = "tester"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
clap = { version = "4.6.0", features = ["derive"] }
rustyline = "18.0.0"
shlex = "1.3.0"
evm = { path = "../evm", default-features = false }

# gRPC and WASIX dependencies

wasix = { version = "0.13.1" }
rand = "=0.8.5"
tokio = {version = "1.47.4", features = ["full"]}
tonic = { version = "0.14.5", default-features = false, features = ["codegen", "transport"]}
prost = "0.14.3"
tonic-prost = "0.14.5"

[build-dependencies]
tonic-prost-build = "0.14.5"