[package]
name = "tester"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.5.7", default-features = false, features = ["serde", "rand"] }
thiserror = { version = "2.0.0", default-features = false }
uint = { version = "0.10.0", default-features = false }

# gRPC and WASIX dependencies
tokio = { version = "1.24.2", features = ["full"] }
tonic = { version = "0.9.2" }
prost = "0.11.0"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4.3"
rustyline = "12.0.0"
shlex = "1.3.0"

[build-dependencies]
tonic-build = "0.9.2"
